  </g>
  <g fill="#FF6B4A" stroke="#1B2A4A" stroke-width="2.5"><circle cx="304" cy="104" r="6"/><circle cx="350" cy="96" r="6"/><circle cx="338" cy="132" r="6"/><circle cx="312" cy="138" r="6"/><circle cx="362" cy="124" r="6"/></g>
  <g stroke="#1B2A4A" stroke-width="4" stroke-linejoin="round">
    <path d="M286 222 c-6-30 4-56 22-62 c10-3 18 4 20 12 l0 50z" fill="#C98A5A"/>
    <circle cx="296" cy="150" r="16" fill="#C98A5A"/>
    <circle cx="284" cy="138" r="5" fill="#C98A5A"/>
    <path d="M308 166 l20 -22" fill="none" stroke-width="7" stroke-linecap="round"/>
  </g>
  <circle cx="292" cy="150" r="2" fill="#1B2A4A"/>
