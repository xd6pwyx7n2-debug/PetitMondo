<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Illustration de Madrid : l'ours et l'arbousier, l'horloge de la Puerta del Sol, une barque sur le lac du Retiro et un churro">
