  <path d="M140 104 v-7 M140 104 h5" stroke="#1B2A4A" stroke-width="3" stroke-linecap="round"/>
  <g fill="#6EC6F0" stroke="#1B2A4A" stroke-width="3"><path d="M58 140 h22 v30 h-22z M98 140 h22 v30 h-22z M160 140 h22 v30 h-22z M200 140 h22 v30 h-22z"/></g>
  <path d="M120 220 v-36 a20 20 0 0 1 40 0 v36" fill="#FF6B4A" stroke="#1B2A4A" stroke-width="4"/>
