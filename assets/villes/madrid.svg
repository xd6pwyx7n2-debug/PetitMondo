    <path d="M60 262 c40 -10 90 -10 130 0 l-4 16 c-40 -10 -82 -10 -122 0z" fill="#E9A85A"/>
    <path d="M80 262 v14 M100 260 v14 M120 259 v14 M140 260 v14 M160 261 v14" stroke-width="2" fill="none"/>
