    <g stroke="#2FB59A"><path d="M520 90 v-22 M520 90 v22 M520 90 h-22 M520 90 h22 M520 90 l-15-15 M520 90 l15 15 M520 90 l15-15 M520 90 l-15 15"/></g>
  </g>
