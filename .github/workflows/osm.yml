name: Mise à jour des données OpenStreetMap

on:
  schedule:
    - cron: "17 4 * * 1"   # chaque lundi vers 5 h (heure de Paris)
  workflow_dispatch:
  push:
    paths:
      - "data/villes/**"
      - "scripts/fetch_osm.py"
      - "scripts/fetch_vacances.py"
      - "scripts/build.py"

permissions:
  contents: write

concurrency:
  group: osm
  cancel-in-progress: false

jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les données OSM
        run: python scripts/fetch_osm.py
      - name: Calendrier des vacances scolaires
        run: python scripts/fetch_vacances.py || true
      - name: Régénérer les pages
        run: python scripts/build.py
      - name: Enregistrer les changements
        run: |
          git config user.name "petitmondo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Données OSM mises à jour ($(date +%F))"
            git pull --rebase
            git push
          fi
