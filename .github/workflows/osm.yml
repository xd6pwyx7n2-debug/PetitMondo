name: Mise à jour des données OpenStreetMap

on:
  schedule:
    - cron: "17 4 * * 1"   # chaque lundi vers 5 h (heure de Paris)
  workflow_dispatch:
  push:
    paths:
      - "data/villes/**"
      - ".github/workflows/osm.yml"
      - "scripts/fetch_osm.py"
      - "scripts/fetch_vacances.py"
      - "scripts/build.py"

permissions:
  contents: write

concurrency:
  group: osm
  cancel-in-progress: false

jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les données OSM
        run: python scripts/fetch_osm.py
      - name: Calendrier des vacances scolaires
        run: python scripts/fetch_vacances.py || true
      - name: Enregistrer (sans conflit avec l'autre action)
        run: |
          git config user.name "petitmondo-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/sauve
          cp -r data/osm /tmp/sauve/osm
          [ -d data/acces ] && cp -r data/acces /tmp/sauve/acces || true
          [ -f data/vacances.json ] && cp data/vacances.json /tmp/sauve/ || true
          for essai in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -r /tmp/sauve/osm data/
            [ -d /tmp/sauve/acces ] && cp -r /tmp/sauve/acces data/ || true
            [ -f /tmp/sauve/vacances.json ] && cp /tmp/sauve/vacances.json data/ || true
            python scripts/build.py
            git add -A
            if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
            git commit -q -m "Données OSM et calendrier mis à jour ($(date +%F))"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((essai * 15))
          done
          exit 1
